name: Export Web

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Record run start and Godot version
        run: |
          echo "Run started at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "GODOT_VERSION pin: $(cat GODOT_VERSION)"
          godot --version

      - name: Install Godot export templates
        run: |
          ENGINE_VERSION="$(godot --version)"
          TEMPLATE_VERSION="$(printf '%s' "${ENGINE_VERSION}" | sed -E 's/^([0-9]+\.[0-9]+(\.[0-9]+)?)\.stable.*/\1.stable/')"
          SOURCE_DIR="/root/.local/share/godot/export_templates/${TEMPLATE_VERSION}"
          if [ ! -d "${SOURCE_DIR}" ]; then
            SOURCE_DIR="/root/.local/share/godot/templates/${TEMPLATE_VERSION}"
          fi
          if [ ! -d "${SOURCE_DIR}" ]; then
            echo "Godot ${TEMPLATE_VERSION} export templates for ${ENGINE_VERSION} not found under /root/.local/share/godot." >&2
            exit 1
          fi
          TARGET_DIR="${HOME}/.local/share/godot/export_templates/${TEMPLATE_VERSION}"
          mkdir -p "$(dirname "${TARGET_DIR}")"
          if [ "${SOURCE_DIR}" != "${TARGET_DIR}" ]; then
            cp -a "${SOURCE_DIR}" "${TARGET_DIR}"
          fi
          echo "Export templates: ${SOURCE_DIR} -> ${TARGET_DIR}"

      - name: Import project
        run: godot --headless --editor --quit --path .

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html --path .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: export-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Web entrypoint and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          PAGE_URL="${PAGE_URL%/}/"
          curl --fail --location --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --output "$RUNNER_TEMP/pages-index.html" "$PAGE_URL"
          grep -q '<script src="index.js"></script>' "$RUNNER_TEMP/pages-index.html" || {
            echo "Deployed HTML does not reference the Godot loader." >&2
            exit 1
          }
          for asset in index.js index.wasm index.pck; do
            curl --fail --head --location --silent --show-error \
              --retry 12 --retry-all-errors --retry-delay 5 "${PAGE_URL}${asset}"
          done
